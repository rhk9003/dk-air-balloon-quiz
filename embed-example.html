<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DK 空氣鞋知識挑戰｜網站嵌入預覽</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eeeae4;color:#382c28;font-family:system-ui,"Microsoft JhengHei",sans-serif}header{padding:20px 24px;background:#fffdf9;border-bottom:1px solid #ded6cc}header div{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:18px;margin:0 0 5px}p{font-size:14px;line-height:1.6;margin:0;color:#6c6058}nav{display:flex;gap:8px}button{font:inherit;font-size:14px;border:1px solid #cdbdaf;border-radius:999px;background:transparent;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#913d35;color:#fff;border-color:#913d35}button:focus-visible{outline:3px solid #e8b755;outline-offset:3px}.frame-wrap{max-width:1100px;margin:24px auto;transition:max-width .2s;background:#fffdf9;box-shadow:0 10px 50px #49332514}iframe{display:block;width:100%;height:1050px;border:0;background:#fffdf9}.frame-wrap.mobile{max-width:390px}@media(max-width:600px){header{padding:16px}.frame-wrap{margin:12px auto;width:100%}}@media(prefers-reduced-motion:reduce){.frame-wrap{transition:none}}
  </style>
</head>
<body>
  <header><div><section><h1>DK 空氣鞋知識挑戰 · 網站嵌入預覽</h1><p>此頁模擬把遊戲放進官網的 iframe 區塊。</p></section><nav aria-label="預覽寬度"><button type="button" id="wide" aria-pressed="true">桌機寬度</button><button type="button" id="narrow" aria-pressed="false">手機寬度</button></nav></div></header>
  <main class="frame-wrap" id="frame-wrap"><iframe id="dk-air-quiz" src="./index.html" title="DK 空氣鞋呼吸小氣球知識挑戰" loading="eager"></iframe></main>
  <script>
    const frame = document.getElementById('dk-air-quiz');
    const wrap = document.getElementById('frame-wrap');
    const wide = document.getElementById('wide');
    const narrow = document.getElementById('narrow');
    function resizeMode(mobile) { wrap.classList.toggle('mobile', mobile); wide.setAttribute('aria-pressed', String(!mobile)); narrow.setAttribute('aria-pressed', String(mobile)); }
    wide.addEventListener('click', () => resizeMode(false));
    narrow.addEventListener('click', () => resizeMode(true));
    window.addEventListener('message', (event) => {
      const expectedOrigin = new URL(frame.src, location.href).origin;
      if (event.source !== frame.contentWindow || event.origin !== expectedOrigin) return;
      if (event.data?.type === 'dk-air-quiz:navigate') {
        requestAnimationFrame(() => window.scrollTo({top: Math.max(0, window.scrollY + frame.getBoundingClientRect().top - 16), behavior: 'instant'}));
        return;
      }
      if (event.data?.type === 'dk-air-quiz:reveal') {
        const {top, bottom} = event.data;
        if (!Number.isFinite(top) || !Number.isFinite(bottom) || top < 0 || bottom < top || bottom > 5000) return;
        requestAnimationFrame(() => {
          const frameTop = frame.getBoundingClientRect().top;
          const delta = frameTop + bottom > innerHeight - 16 ? frameTop + bottom - innerHeight + 16 : frameTop + top < 16 ? frameTop + top - 16 : 0;
          if (delta) window.scrollBy({top: delta, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'});
        });
        return;
      }
      if (event.data?.type !== 'dk-air-quiz:resize' || !Number.isFinite(event.data.height)) return;
      frame.style.height = Math.max(600, Math.min(2400, Math.ceil(event.data.height))) + 'px';
    });
  </script>
</body>
</html>
